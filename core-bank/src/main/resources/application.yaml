spring:
  application:
    name: core-bank
  datasource:
    url: ${CORE_DB_URL:jdbc:postgresql://localhost:5433/lastro}
    username: ${CORE_DB_USER:lastro_core}
    password: ${CORE_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  flyway:
    default-schema: core
    create-schemas: true
  jackson:
    deserialization:
      # 10.9 em campo de centavos é erro, não 10
      accept-float-as-int: false
      fail-on-unknown-properties: true
  threads:
    virtual:
      enabled: true

server:
  port: ${CORE_PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  structured:
    format:
      console: ecs

lastro:
  sentinel:
    url: ${LASTRO_SENTINEL_URL:http://127.0.0.1:8081}
    # O mesmo SENTINEL_SECRET do serviço em Go; sem ele a aplicação não sobe.
    secret: ${LASTRO_SENTINEL_SECRET:}
    worker: ${LASTRO_SENTINEL_WORKER:true}
  assistant:
    # Chave da API do Claude para o chat do Lino. Sem ela, o Lino responde com perguntas prontas.
    api-key: ${LASTRO_ANTHROPIC_API_KEY:}
    model: ${LASTRO_ASSISTANT_MODEL:claude-opus-5-5}
  helpdesk:
    # Webhook do n8n que abre o atendimento no WhatsApp. Sem ele, o protocolo fica só no banco.
    n8n-webhook-url: ${LASTRO_N8N_WEBHOOK_URL:}
    n8n-webhook-secret: ${LASTRO_N8N_WEBHOOK_SECRET:}
  cdi:
    # Busca o CDI no Banco Central e paga o rendimento das caixinhas
    schedule: ${LASTRO_CDI_SCHEDULE:true}
  security:
    issuer: lastro-core
    audience: lastro
    access-token-ttl: 15m
    refresh-token-ttl: 14d
    # PEM PKCS#8. Sem ela a aplicação só sobe se allow-generated-key for true.
    private-key-pem: ${LASTRO_JWT_PRIVATE_KEY:}
    allow-generated-key: false
    allowed-origins: ${LASTRO_ALLOWED_ORIGINS:http://localhost:5173}
